spring:
  application:
    name: iam-service
  datasource:
    url: jdbc:postgresql://localhost:5432/post_hub_l
    username: root
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        default_schema: v1_iam_service
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: v1_iam_service

end:
  point:
    posts: /posts
    id: /{id}
    create: /create
    all: /all

server:
  servlet:
    context-path: /
  port: 8189

logging:
  level:
    com:
      my:
        iam_service: TRACE
    org:
      springframework:
        web: debug
      flywaydb: debug

